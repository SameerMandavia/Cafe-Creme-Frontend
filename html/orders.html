<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Online | Cafe-Creme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/orders.css" />
  </head>
  <body data-page="orders">
    <div id="site-header"></div>
    <main class="container page-section">
      <div class="page-intro">
        <p class="cafe-eyebrow">Ready when you are</p>
        <h1>Order online</h1>
        <p>Choose your favourites for a quick collection from the cafe.</p>
      </div>
      <div class="row g-4">
        <div class="col-lg-8">
          <section class="order-panel" id="order-items"></section>
        </div>
        <div class="col-lg-4">
          <aside class="order-summary" id="order-summary"></aside>
        </div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/menu-data.js"></script>
    <script src="../javascript/orders.js"></script>
  </body>
</html>
