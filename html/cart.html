<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | Cafe-Creme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/cart.css" />
    <link rel="stylesheet" href="../css/festival.css" />
  </head>
  <body data-page="cart">
    <div id="site-header"></div>
    <main class="container page-section">
      <div class="page-intro"><p class="cafe-eyebrow">Almost ready</p><h1>Your cart</h1><p>Review your favourites, choose a collection time, and place your order.</p></div>
      <div id="cart-empty" class="empty-cart d-none"><h2>Your cart is empty</h2><p>Add something delicious from our menu to get started.</p><a class="btn btn-dark" href="menu.html">Browse menu</a></div>
      <div id="cart-content" class="row g-4">
        <div class="col-lg-7"><section class="cart-panel"><div id="cart-items"></div></section></div>
        <div class="col-lg-5"><section class="cart-panel checkout-panel"><h2>Checkout</h2><form id="checkout-form"><label class="form-label" for="checkout-name">Your name</label><input class="form-control mb-3" id="checkout-name" name="name" required /><label class="form-label" for="checkout-phone">Phone number</label><input class="form-control mb-3" id="checkout-phone" name="phone" type="tel" required /><label class="form-label" for="checkout-time">Collection time</label><select class="form-select mb-3" id="checkout-time" name="collectionTime" required><option value="">Choose a time</option><option>10:00 AM - 10:15 AM</option><option>12:30 PM - 12:45 PM</option><option>5:00 PM - 5:15 PM</option><option>7:30 PM - 7:45 PM</option></select><div class="checkout-total d-flex justify-content-between"><strong>Total</strong><strong id="cart-total">₹0</strong></div><button class="btn btn-dark w-100 mt-4" type="submit">Place order</button></form><output id="checkout-status"></output></section></div>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/festival.js"></script>
    <script src="../javascript/menu-data.js"></script>
    <script src="../javascript/cart.js"></script>
  </body>
</html>
