<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu | Cafe-Creme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/menu.css" />
    <link rel="stylesheet" href="../css/festival.css" />
  </head>
  <body data-page="menu">
    <div id="site-header"></div>
    <main class="container page-section">
      <div class="page-intro">
        <p class="cafe-eyebrow">Brewed with care</p>
        <h1>What are you craving?</h1>
        <p>
          Fresh cafe favourites, made to order. Add items to your cart and choose a collection time at checkout.
        </p>
      </div>
      <div class="menu-toolbar" id="categories">
        <label class="visually-hidden" for="menu-search">Search the menu</label>
        <input id="menu-search" class="form-control" type="search" placeholder="Search coffee, bakes, and more" autocomplete="off" />
        <div id="menu-filters" class="menu-filters" aria-label="Menu categories"></div>
      </div>
      <p id="menu-result-count" class="menu-result-count" aria-live="polite"></p>
      <aside class="menu-cart-summary" id="menu-cart-summary" aria-live="polite"><span><strong id="menu-cart-items">0 items</strong><small id="menu-cart-total">₹0</small></span><a class="btn btn-light btn-sm" href="cart.html">View cart</a></aside>
      <div id="festival-menu-feature" class="d-none" aria-live="polite"></div>
      <div class="row g-4" id="menu-categories"></div>
      <div class="modal fade" id="menu-item-modal" tabindex="-1" aria-labelledby="menu-item-modal-title" aria-hidden="true"><div class="modal-dialog modal-dialog-centered"><div class="modal-content product-detail-modal"><div class="modal-body"><button type="button" class="btn-close float-end" data-bs-dismiss="modal" aria-label="Close"></button><img id="menu-modal-image" class="product-detail-image" alt="" /><p id="menu-modal-category" class="cafe-eyebrow mt-3 mb-1"></p><h2 id="menu-item-modal-title"></h2><p id="menu-modal-description"></p><div class="product-detail-meta"><span id="menu-modal-rating"></span><span id="menu-modal-time"></span></div><div class="d-flex align-items-center justify-content-between mt-4"><strong id="menu-modal-price"></strong><button id="menu-modal-add" class="btn btn-dark" type="button">Add to order</button></div></div></div></div></div>
      <div class="page-cta">
        <p>Want it ready when you arrive?</p>
        <a class="btn btn-dark" href="cart.html">Go to checkout</a>
      </div>
    </main>
    <div id="site-footer"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/festival.js"></script>
    <script src="../javascript/api-client.js"></script>
    <script src="../javascript/menu-data.js"></script>
    <script src="../javascript/menu.js"></script>
  </body>
</html>
