<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | Cafe-Creme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/festival.css" />
  </head>
  <body data-page="signup">
    <div id="site-header"></div>
    <main class="container page-section auth-page">
      <div class="auth-shell">
        <p class="cafe-eyebrow">Join the table</p>
        <h1>Create an account</h1>
        <form id="signup-form">
          <label class="form-label" for="signup-name">Name</label>
          <input class="form-control mb-3" id="signup-name" name="name" type="text" required />
          <label class="form-label" for="signup-email">Email</label>
          <input class="form-control mb-3" id="signup-email" name="email" type="email" required />
          <label class="form-label" for="signup-phone">Contact number</label>
          <input class="form-control mb-3" id="signup-phone" name="phone" type="tel" autocomplete="tel" required />
          <label class="form-label" for="signup-password">Password</label>
          <input class="form-control mb-3" id="signup-password" name="password" type="password" minlength="6" required />
          <button class="btn btn-dark w-100" type="submit">Create account</button>
        </form>
        <output id="auth-status"></output>
        <p class="auth-switch">Already have an account? <a href="login.html">Login</a></p>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/festival.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/signup.js"></script>
  </body>
</html>
