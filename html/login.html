<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Cafe-Creme</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="stylesheet" href="../css/festival.css" />
  </head>
  <body data-page="login">
    <div id="site-header"></div>
    <main class="container page-section auth-page">
      <div class="auth-shell">
        <p class="cafe-eyebrow">Welcome back</p>
        <h1>Login</h1>
        <form id="login-form">
          <label class="form-label" for="login-email">Email</label>
          <input class="form-control mb-3" id="login-email" name="email" type="email" required />
          <label class="form-label" for="login-password">Password</label>
          <input class="form-control mb-3" id="login-password" name="password" type="password" required />
          <button class="btn btn-dark w-100" type="submit">Login</button>
        </form>
        <output id="auth-status"></output>
        <p class="auth-switch">New to Cafe-Creme? <a href="signup.html">Create an account</a></p>
        <p class="demo-note">Demo admin: admin@cafecreme.local / admin123</p>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/festival.js"></script>
    <script src="../javascript/auth.js"></script>
    <script src="../javascript/api-client.js"></script>
    <script src="../javascript/login.js"></script>
  </body>
</html>
