<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservations | Cafe-Creme</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/reservations.css" />
    <link rel="stylesheet" href="../css/festival.css" />
  </head>
  <body data-page="reservations">
    <div id="site-header"></div>
    <main class="container page-section">
      <div class="page-intro">
        <p class="cafe-eyebrow">Make it a plan</p>
        <h1>Reserve a table</h1>
        <p>
          Tell us when you would like to visit and we will keep a cosy spot
          ready.
        </p>
      </div>
      <div class="form-shell">
        <form id="reservation-form">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="reservation-name">Your name</label
              ><input
                class="form-control"
                id="reservation-name"
                name="name"
                type="text"
                placeholder="Sameer Mandavia"
                required
              />
            </div>
            <div class="col-md-6">
              <label class="form-label" for="reservation-email"
                >Email address</label
              ><input
                class="form-control"
                id="reservation-email"
                name="email"
                type="email"
                placeholder="you@example.com"
                required
              />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="reservation-date">Date</label
              ><input
                class="form-control"
                id="reservation-date"
                name="date"
                type="date"
                required
              />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="reservation-time">Time</label
              ><input
                class="form-control"
                id="reservation-time"
                name="time"
                type="time"
                required
              />
            </div>
            <div class="col-md-4">
              <label class="form-label" for="reservation-guests">Guests</label
              ><select class="form-select" id="reservation-guests" name="guests">
                <option value="2">2 guests</option>
                <option value="3">3 guests</option>
                <option value="4">4 guests</option>
                <option value="5">5+ guests</option>
              </select>
            </div>
            <div class="col-12">
              <label class="form-label" for="reservation-note"
                >Anything we should know?</label
              ><textarea
                class="form-control"
                id="reservation-note"
                name="note"
                rows="4"
                placeholder="Birthday, accessibility needs, or a favourite table..."
              ></textarea>
            </div>
            <div class="col-12">
              <button class="btn btn-dark" type="submit">
                Request reservation
              </button>
            </div>
          </div>
        </form>
        <output id="reservation-status"></output>
      </div>
    </main>
    <div id="site-footer"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="../javascript/layout.js"></script>
    <script src="../javascript/festival.js"></script>
    <script src="../javascript/reservations.js"></script>
  </body>
</html>
